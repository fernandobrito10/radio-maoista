services:
  bot:
    build: .
    image: radio-maoista
    container_name: radio-maoista
    restart: unless-stopped
    # PID 1 que reap zombie e repassa SIGTERM: o bot spawna um yt-dlp por faixa
    init: true
    env_file: .env
    environment:
      # fixa o caminho do binario dentro da imagem, ignorando o do .env
      YTDLP_PATH: /usr/local/bin/yt-dlp
      # 0 desliga o "yt-dlp -U" a cada boot
      YTDLP_AUTO_UPDATE: "1"
      # 1 registra os slash commands ao subir (deixe 0 no dia a dia)
      DEPLOY_COMMANDS_ON_START: "0"
      TZ: America/Sao_Paulo
    volumes:
      # session keys do Last.fm — precisa persistir entre recriacoes
      - ./data:/app/data
    # Sem teto, uma rajada de yt-dlp derruba o HOST (o Pi inteiro), nao so o bot:
    # quem escolhe a vitima passa a ser o OOM killer, e pode ser o sshd.
    mem_limit: 700m
    pids_limit: 256
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # o shutdown precisa de folga pra sair do canal de voz antes de morrer
    stop_grace_period: 20s
    # SD card nao gosta de log infinito
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
